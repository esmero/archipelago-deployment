# Run `docker-compose up` -d or `docker compose up -d` if on MacOS
# If running Linux, make sure /persistent/iiifcache has 8183:8183 ownership
# If running Linux, make sure /persistent/solrcore has 8983:8983 ownership
# enabling :cache for the volumens can bypass that need.
# on OSX brew install minio/stable/mc for the minio client
services:
  web:
    container_name: esmero-web
    restart: always
    image: "nginx"
    depends_on:
      - solr
      - php
    tty: true
    ports:
      - "8001:80"
    networks:
      - host-net
      - esmero-net
    volumes:
      - ${PWD}/nginxconfigford8/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ${PWD}:/var/www/html:cached
  php:
    container_name: esmero-php
    restart: always
    image: "esmero/php-8.3-fpm:1.5.0-multiarch"
    tty: true
    networks:
      - host-net
      - esmero-net
    volumes:
      - ${PWD}:/var/www/html:cached
  solr:
    container_name: esmero-solr
    restart: always
    image: "solr:9.8.1"
    # If running Docker < 20.10.10 please uncomment the following lines
    # See https://solr.apache.org/guide/solr/latest/upgrade-notes/major-changes-in-solr-9.html#solr-9-8
    #security_opt:
    #  - seccomp:unconfined
    tty: true
    environment:
      SOLR_HEAP: 512m
      SOLR_OPTS: -Dsolr.jetty.request.header.size=65535 -Dsolr.install.dir=/opt/solr
      SOLR_MODULES: "extraction,langid,ltr,analysis-extras,scripting"
    ports:
      - "8983:8983"
    networks:
      - host-net
      - esmero-net
    volumes:
      - ${PWD}/persistent/solrcore:/var/solr/data:cached
      - ${PWD}/persistent/solrconfig:/drupalconfig:cached
      - ${PWD}/persistent/solrlib:/var/solr/data/lib:cached
    entrypoint:
      - docker-entrypoint.sh
      - solr-precreate
      - drupal
      - /drupalconfig
  # see https://hub.docker.com/_/mysql/
  db:
    image: mysql:8.0.42
    command: mysqld --transaction-isolation=READ-COMMITTED --default-authentication-plugin=mysql_native_password  --skip-log-bin --max_allowed_packet=256M --sort_buffer_size=512K --lower_case_table_names=1 --innodb_read_only_compressed=OFF
    container_name: esmero-db
    restart: always
    cap_add:
      - SYS_NICE
    environment:
      MYSQL_ROOT_PASSWORD: esmerodb
    networks:
      - host-net
      - esmero-net
    volumes:
      - ${PWD}/persistent/db:/var/lib/mysql:cached
  nlp:
    container_name: esmero-nlp
    restart: always
    image: "esmero/esmero-nlp:1.4.2-fasttext-multiarch"
    # ML processing image. replace previous line with this if using Semantic Search or Image similarity 
    #image: "esmero/esmero-nlp:1.4.2-amd64"
    #environment:
      #MOBILENET_MODEL_NAME: mobilenet_v3_large.tflite
    ports:
      - "6400:6400"
    networks:
      - host-net
      - esmero-net
  iiif:
    container_name: esmero-cantaloupe
    image: "esmero/cantaloupe-s3:6.0.5-noturbojpeg-multiarch"
    restart: always
    environment:
      XMX: 2g
      XMS: 256m
      JAVA_OPS: -XX:+UseZGC
    ports:
      - "8183:8182"
    networks:
      - host-net
      - esmero-net
    volumes:
      - ${PWD}/persistent/iiifconfig:/etc/cantaloupe
      - ${PWD}/persistent/iiifcache:/var/cache/cantaloupe
  minio:
    container_name: esmero-minio
    restart: always
    image: minio/minio:latest
    volumes:
         - ${PWD}/persistent/miniodata:/data:cached
    ports:
         - "9000:9000"
         - "9001:9001"
    networks:
      - host-net
      - esmero-net
    environment:
         MINIO_ROOT_USER: minio
         MINIO_ROOT_PASSWORD: minio123
    command: server /data --console-address ":9001"
networks:
  host-net:
    driver: bridge
  esmero-net:
    driver: bridge
    internal: true
